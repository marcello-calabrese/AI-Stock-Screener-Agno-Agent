<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Screener - API Test Client</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #888;
        }
        .status-dot.healthy {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        .status-dot.error {
            background: #ff4444;
        }
        .chat-container {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
        }
        .message.user {
            background: linear-gradient(135deg, #00d9ff, #0099cc);
            margin-left: auto;
            text-align: right;
        }
        .message.assistant {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .message.error {
            background: rgba(255,68,68,0.2);
            border: 1px solid #ff4444;
            color: #ff6666;
        }
        .message pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            margin: 0;
        }
        .input-container {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
            border: 1px solid rgba(255,255,255,0.1);
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #00d9ff;
        }
        input[type="text"]::placeholder {
            color: #666;
        }
        button {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,217,255,0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .option label {
            color: #888;
            font-size: 0.9rem;
        }
        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .option input[type="text"] {
            width: 150px;
            padding: 8px 12px;
            font-size: 0.9rem;
        }
        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00d9ff;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,217,255,0.3);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .examples {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        .examples h3 {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .example-btn {
            padding: 8px 16px;
            margin: 4px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .example-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Stock Screener</h1>
        <p class="subtitle">Test Client for FastAPI Agent</p>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="healthDot"></div>
                <span id="healthStatus">Checking API...</span>
            </div>
            <div class="status-item">
                <span>Session: <span id="sessionId">-</span></span>
            </div>
        </div>

        <div class="options">
            <div class="option">
                <input type="checkbox" id="useStreaming" checked>
                <label for="useStreaming">Use Streaming</label>
            </div>
            <div class="option">
                <label for="userId">User ID:</label>
                <input type="text" id="userId" value="chrome_user" placeholder="User ID">
            </div>
            <button onclick="newSession()" style="padding: 8px 16px; font-size: 0.85rem;">New Session</button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <pre>👋 Welcome! Ask me anything about stocks - fundamental analysis, recommendations, comparisons, and more!</pre>
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Ask about stocks (e.g., 'Analyze AAPL stock fundamentals')" onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>

        <div class="examples">
            <h3>💡 Example queries (click to try):</h3>
            <button class="example-btn" onclick="setExample('Analyze AAPL stock and give me a buy/sell recommendation')">Analyze AAPL</button>
            <button class="example-btn" onclick="setExample('Compare MSFT and GOOGL stocks')">Compare MSFT vs GOOGL</button>
            <button class="example-btn" onclick="setExample('What are the top 5 tech stocks to invest in right now?')">Top 5 Tech Stocks</button>
            <button class="example-btn" onclick="setExample('What is the P/E ratio of NVDA and is it overvalued?')">NVDA Valuation</button>
            <button class="example-btn" onclick="setExample('Give me recent news sentiment for TSLA')">TSLA News Sentiment</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let sessionId = null;

        // Check API health on load
        async function checkHealth() {
            const dot = document.getElementById('healthDot');
            const status = document.getElementById('healthStatus');
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                if (data.status === 'healthy') {
                    dot.classList.add('healthy');
                    status.textContent = 'API Connected';
                    // Get a session ID
                    await newSession();
                }
            } catch (e) {
                dot.classList.add('error');
                status.textContent = 'API Offline - Start the server!';
            }
        }

        async function newSession() {
            try {
                const response = await fetch(`${API_BASE}/api/session/new`, { method: 'POST' });
                const data = await response.json();
                sessionId = data.session_id;
                document.getElementById('sessionId').textContent = sessionId.substring(0, 8) + '...';
            } catch (e) {
                console.error('Failed to create session:', e);
            }
        }

        function addMessage(content, role) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<pre>${content}</pre>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function setExample(text) {
            document.getElementById('messageInput').value = text;
            document.getElementById('messageInput').focus();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            input.value = '';

            // Add user message
            addMessage(message, 'user');

            const useStreaming = document.getElementById('useStreaming').checked;
            const userId = document.getElementById('userId').value || 'chrome_user';

            const requestBody = {
                message: message,
                session_id: sessionId,
                user_id: userId
            };

            if (useStreaming) {
                await sendStreamingMessage(requestBody);
            } else {
                await sendRegularMessage(requestBody);
            }

            sendBtn.disabled = false;
        }

        async function sendRegularMessage(requestBody) {
            const loadingDiv = addMessage('<div class="loading"><div class="spinner"></div>Thinking...</div>', 'assistant');

            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                loadingDiv.innerHTML = `<pre>${data.response || data.detail || 'No response'}</pre>`;

                if (data.session_id) {
                    sessionId = data.session_id;
                }
            } catch (e) {
                loadingDiv.className = 'message error';
                loadingDiv.innerHTML = `<pre>Error: ${e.message}\n\nMake sure the API server is running:\nuv run uvicorn api:app --reload --port 8000</pre>`;
            }
        }

        async function sendStreamingMessage(requestBody) {
            const responseDiv = addMessage('<div class="loading"><div class="spinner"></div>Thinking...</div>', 'assistant');

            try {
                const response = await fetch(`${API_BASE}/api/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.session_id) {
                                    sessionId = data.session_id;
                                }
                                if (data.content) {
                                    fullContent += data.content.replace(/\\n/g, '\n').replace(/\\"/g, '"');
                                    responseDiv.innerHTML = `<pre>${fullContent}</pre>`;
                                    document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
                                }
                                if (data.error) {
                                    responseDiv.className = 'message error';
                                    responseDiv.innerHTML = `<pre>Error: ${data.error}</pre>`;
                                }
                            } catch (e) {
                                // Skip invalid JSON
                            }
                        }
                    }
                }

                if (!fullContent) {
                    responseDiv.innerHTML = `<pre>No response received</pre>`;
                }
            } catch (e) {
                responseDiv.className = 'message error';
                responseDiv.innerHTML = `<pre>Error: ${e.message}\n\nMake sure the API server is running:\nuv run uvicorn api:app --reload --port 8000</pre>`;
            }
        }

        // Initialize
        checkHealth();
    </script>
</body>
</html>

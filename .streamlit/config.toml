[theme]
base = "dark"

# General color setup - Modern, high-contrast palette
textColor = "#FAFAFA"
primaryColor = "#00D9FF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1C1E26"



# Dataframes - Better readability
dataframeHeaderBackgroundColor = "#1C1E26"

# Base text - Optimal readability
font = "sans-serif"
baseFontWeight = 400
baseFontSize = 16

# Heading text - Clear hierarchy
headingFont = "sans-serif"
headingFontWeights = [700, 600, 500, 500, 400, 400]
headingFontSizes = ["2.25rem", "1.75rem", "1.5rem", "1.25rem", "1.1rem", "1rem"]

